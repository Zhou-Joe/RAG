[project]
name = "fos-rag"
version = "0.1.0"
description = "FOS·RAG — 游乐设施维护手册智能检索系统 (Django + LangGraph RAG)"
requires-python = ">=3.13"
dependencies = [
    # Web 框架（ASGI，支持 SSE 流式）
    "django==6.0.6",
    "daphne==4.2.2",
    # Agent 框架
    "langchain==1.3.9",
    "langchain-openai==1.3.2",
    "langchain-chroma==0.2.6",
    "langchain-text-splitters==1.1.1",
    "langgraph==1.2.5",
    "langgraph-checkpoint-sqlite==3.1.1",
    # 向量数据库
    "chromadb==1.5.9",
    # OpenAI 兼容客户端
    "openai==2.42.0",
    # HTTP 客户端（调 MinerU API / LLM / Embedding）
    "httpx==0.28.1",
    "cryptography==50.0.0",
    "playwright==1.58.0",
    # Agent 异步 SQLite 记忆
    "aiosqlite==0.22.1",
    # 环境变量加载
    "python-dotenv==1.2.1",
    # CSV/XLSX structured-data imports
    "openpyxl==3.1.5",
    "olefile==0.47",
    # Local PDF OCR service used by the one-click deployment script.
    # 只通过 HTTP v1 接口调用；kb/pipeline.py 同时支持 4.0.x（File API）
    # 与 4.1.x（Tasks API），按服务端 /v1/health 报的版本号自动选择。
    "mineru[torch]==4.1.7",
]

[tool.uv]
# 仅供开发/管理命令使用，非核心运行依赖
[dependency-groups]
dev = []
