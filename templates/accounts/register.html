{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · FOS_RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/fos.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="ah"><span class="lock">🔒</span>注册 · REGISTER</div>
    <div class="ab">
      <div class="at">创建维护手册检索账号</div>
      {% if form.errors %}<div class="auth-error">注册信息有误，请检查（密码至少 6 位、不能为纯数字）。</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field"><label>用户名</label><input name="username" autofocus required></div>
        <div class="field"><label>密码</label><input name="password1" type="password" required></div>
        <div class="field"><label>确认密码</label><input name="password2" type="password" required></div>
        <button class="btn primary" type="submit">注册</button>
      </form>
      <div class="auth-foot">已有账号？<a href="/accounts/login/">登录</a></div>
    </div>
  </div>
</div>
</body>
</html>
