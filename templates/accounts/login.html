{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · FOS_RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/fos.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="ah"><span class="lock">🔒</span>登录 · LOGIN</div>
    <div class="ab">
      <div class="at">进入维护手册检索系统</div>
      {% if form.errors %}<div class="auth-error">用户名或密码不正确。</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field"><label>用户名</label><input name="username" autofocus required></div>
        <div class="field"><label>密码</label><input name="password" type="password" required></div>
        <button class="btn primary" type="submit">登录</button>
      </form>
      <div class="auth-foot">没有账号？<a href="/accounts/register/">注册</a></div>
    </div>
  </div>
</div>
</body>
</html>
